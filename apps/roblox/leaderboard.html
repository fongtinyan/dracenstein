<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Roblox Clone — Dracenstein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#080808;--surface:#0f0f0f;--border:#1e1e1e;--accent:#c8a96e;--accent2:#4a9eff;--text:#e8e4dc;--muted:#666;--danger:#cc3333;--gold:#ffd700;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,169,110,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,169,110,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 24px;}
nav{padding:20px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Cinzel',serif;font-size:20px;font-weight:900;color:var(--accent);letter-spacing:3px;text-decoration:none;}
.logo span{color:var(--danger);}
nav a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:2px;transition:color .2s;}
nav a:hover{color:var(--accent);}
.nav-links{display:flex;gap:28px;}
.page-header{padding:60px 0 40px;border-bottom:1px solid var(--border);text-align:center;}
.page-header h1{font-family:'Cinzel',serif;font-size:clamp(24px,5vw,40px);font-weight:900;color:var(--gold);margin-bottom:8px;}
.page-header p{font-size:12px;color:var(--muted);letter-spacing:2px;}
.board{margin:40px 0;border:1px solid var(--border);}
.board-row{display:grid;grid-template-columns:50px 1fr 100px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);transition:background .2s;}
.board-row:last-child{border-bottom:none;}
.board-row:hover{background:var(--surface);}
.board-row.header{background:var(--surface);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.rank{font-family:'Cinzel',serif;font-weight:900;font-size:18px;color:var(--muted);}
.rank-1{color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,0.4);}
.rank-2{color:#c0c0c0;}
.rank-3{color:#cd7f32;}
.player-name{font-size:14px;letter-spacing:1px;}
.player-time{font-size:14px;color:var(--accent2);text-align:right;letter-spacing:1px;}
.status{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
.play-btn{display:block;margin:0 auto 40px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:12px 32px;font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:bold;cursor:pointer;letter-spacing:2px;transition:opacity .2s;}
.play-btn:hover{opacity:.85;}
footer{border-top:1px solid var(--border);padding:40px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--accent);}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../../index.html" class="logo">DRACEN<span>STEIN</span></a>
    <div class="nav-links">
      <a href="v2/index.html">PLAY</a>
      <a href="../../blog/index.html">BLOG</a>
    </div>
  </nav>
  <div class="page-header">
    <h1>Leaderboard</h1>
    <p>// roblox clone — fastest coin collectors</p>
  </div>
  <div class="board" id="board">
    <div class="board-row header">
      <div>#</div>
      <div>PLAYER</div>
      <div style="text-align:right;">TIME</div>
    </div>
  </div>
  <div id="status" class="status">Loading scores...</div>
  <button class="play-btn" onclick="window.location.href='v2/index.html'">PLAY NOW</button>
  <footer>
    <div>DRACENSTEIN — FONGTINYAN — SYDNEY</div>
    <div><a href="https://github.com/fongtinyan/dracenstein" target="_blank">github</a></div>
  </footer>
</div>
<script>
var SUPABASE_URL='https://pmvgkmiihqyvgjcdcyjw.supabase.co';
var SUPABASE_KEY='sb_publishable_DEcvBo1uq0dPziHCrUwfTQ_0sq6xkz5';

fetch(SUPABASE_URL+'/rest/v1/scores?select=username,time_seconds&order=time_seconds.asc&limit=10',{
  headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
}).then(function(r){ return r.json(); }).then(function(data){
  var board=document.getElementById('board');
  var status=document.getElementById('status');
  if(!data.length){
    status.textContent='No scores yet. Be the first!';
    return;
  }
  status.style.display='none';
  data.forEach(function(row,i){
    var div=document.createElement('div');
    div.className='board-row';
    var rankClass='rank';
    if(i===0) rankClass+=' rank-1';
    else if(i===1) rankClass+=' rank-2';
    else if(i===2) rankClass+=' rank-3';
    div.innerHTML=
      '<div class="'+rankClass+'">'+(i+1)+'</div>'+
      '<div class="player-name">'+row.username+'</div>'+
      '<div class="player-time">'+row.time_seconds.toFixed(1)+'s</div>';
    board.appendChild(div);
  });
}).catch(function(e){
  document.getElementById('status').textContent='Failed to load scores: '+e.message;
});
</script>
</body>
</html>
