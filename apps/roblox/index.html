<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Clone — Dracenstein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#080808;--surface:#0f0f0f;--border:#1e1e1e;--accent:#c8a96e;--accent2:#4a9eff;--text:#e8e4dc;--muted:#666;--danger:#cc3333;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,169,110,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,169,110,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 24px;}
nav{padding:20px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Cinzel',serif;font-size:20px;font-weight:900;color:var(--accent);letter-spacing:3px;text-decoration:none;}
.logo span{color:var(--danger);}
nav a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:2px;transition:color .2s;}
nav a:hover{color:var(--accent);}
.nav-links{display:flex;gap:28px;}
.page-header{padding:60px 0 40px;border-bottom:1px solid var(--border);}
.page-header h1{font-family:'Cinzel',serif;font-size:clamp(28px,5vw,48px);font-weight:900;color:var(--text);margin-bottom:8px;}
.page-header .week{font-size:11px;color:var(--accent);letter-spacing:3px;margin-bottom:16px;}
.page-header p{font-size:13px;color:var(--muted);line-height:1.8;}
.tags{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;}
.tag{display:inline-block;font-size:10px;letter-spacing:2px;color:var(--accent2);border:1px solid rgba(74,158,255,0.3);padding:3px 8px;}
.section{padding:40px 0;}
.section-title{font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.version-list{border:1px solid var(--border);}
.version-row{display:grid;grid-template-columns:60px 100px 1fr auto;align-items:center;gap:20px;padding:20px 24px;border-bottom:1px solid var(--border);transition:background .2s;}
.version-row:last-child{border-bottom:none;}
.version-row:hover{background:var(--surface);}
.ver-label{font-family:'Cinzel',serif;font-size:18px;font-weight:900;color:var(--text);}
.ver-label.latest{color:var(--accent);}
.ver-date{font-size:11px;color:var(--muted);letter-spacing:1px;}
.ver-note{font-size:12px;color:var(--muted);line-height:1.6;}
.ver-play{display:inline-block;text-decoration:none;font-size:11px;letter-spacing:2px;color:var(--bg);background:var(--accent);padding:6px 16px;transition:opacity .2s;white-space:nowrap;}
.ver-play:hover{opacity:.85;}
.ver-play.latest-btn{background:var(--accent2);}
.extra-links{margin-top:24px;display:flex;gap:20px;}
.extra-links a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:1px;border:1px solid var(--border);padding:8px 16px;transition:color .2s,border-color .2s;}
.extra-links a:hover{color:var(--accent);border-color:var(--accent);}
footer{border-top:1px solid var(--border);padding:40px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--accent);}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}
@media(max-width:600px){.version-row{grid-template-columns:1fr;gap:8px;}.nav-links{gap:16px;}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../../index.html" class="logo">DRACEN<span>STEIN</span></a>
    <div class="nav-links">
      <a href="../index.html">APPS</a>
      <a href="../../blog/index.html">BLOG</a>
    </div>
  </nav>
  <div class="page-header" id="header"></div>
  <section class="section">
    <div class="section-title">Versions</div>
    <div class="version-list" id="version-list"></div>
    <div class="extra-links" id="extra-links"></div>
  </section>
  <footer>
    <div>DRACENSTEIN — FONGTINYAN — SYDNEY</div>
    <div><a href="https://github.com/fongtinyan/dracenstein" target="_blank">github</a></div>
  </footer>
</div>
<script>document.write('<script src="../../data.js?t='+Date.now()+'"><\/script>');</script>
<script>
(function(){
  if(typeof SITE_DATA === 'undefined') return;
  // Find this app by matching the URL path
  var app = null;
  var pathParts = location.pathname.replace(/\/index\.html$/, '').split('/');
  var appId = pathParts[pathParts.length - 1] || 'roblox';
  // For file:// fallback, also try folder name
  if(!appId || appId === '') appId = 'roblox';
  SITE_DATA.apps.forEach(function(a){ if(a.id === appId) app = a; });
  if(!app) app = SITE_DATA.apps[0];
  if(!app) return;

  // Header
  var header = document.getElementById('header');
  header.innerHTML =
    '<div class="week">WEEK ' + String(app.week).padStart(3,'0') + '</div>' +
    '<h1>' + app.name + '</h1>' +
    '<p>' + app.desc + '</p>' +
    '<div class="tags">' + app.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('') + '</div>';
  document.title = app.name + ' — Dracenstein';

  // Versions (newest first)
  var list = document.getElementById('version-list');
  var versions = app.versions.slice().reverse();
  versions.forEach(function(v, i){
    var isLatest = (i === 0);
    var row = document.createElement('a');
    row.href = v.path;
    row.className = 'version-row';
    row.style.textDecoration = 'none';
    row.style.color = 'inherit';
    row.innerHTML =
      '<div class="ver-label' + (isLatest ? ' latest' : '') + '">' + v.ver + '</div>' +
      '<div class="ver-date">' + v.date + '</div>' +
      '<div class="ver-note">' + v.note + '</div>' +
      '<div class="ver-play' + (isLatest ? ' latest-btn' : '') + '">' + (isLatest ? 'PLAY LATEST' : 'PLAY') + '</div>';
    list.appendChild(row);
  });

  // Extra links
  var extras = document.getElementById('extra-links');
  extras.innerHTML = '<a href="leaderboard.html">Leaderboard</a>';
})();
</script>
</body>
</html>
