<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post — Dracenstein</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;--surface:#0f0f0f;--border:#1e1e1e;
  --accent:#c8a96e;--accent2:#4a9eff;--text:#e8e4dc;--muted:#666;--danger:#cc3333;
}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,169,110,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,169,110,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 24px;}
nav{padding:20px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.logo{font-family:'Cinzel',serif;font-size:20px;font-weight:900;color:var(--accent);letter-spacing:3px;text-decoration:none;}
.logo span{color:var(--danger);}
nav a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:2px;transition:color .2s;}
nav a:hover{color:var(--accent);}

.post-header{padding:60px 0 40px;border-bottom:1px solid var(--border);}
.post-meta{font-size:11px;color:var(--muted);letter-spacing:3px;margin-bottom:20px;}
.post-meta span{color:var(--accent);}
.post-title{font-family:'Cinzel',serif;font-size:clamp(28px,5vw,48px);font-weight:900;line-height:1.1;margin-bottom:20px;}
.post-tags{margin-top:12px;}
.post-tag{display:inline-block;font-size:9px;letter-spacing:2px;color:var(--accent2);border:1px solid rgba(74,158,255,0.2);padding:2px 6px;margin-right:4px;}

.post-body{padding:48px 0;font-family:'Lora',serif;font-size:17px;line-height:1.9;color:#ccc8c0;}
.post-body p{margin-bottom:24px;}
.post-body h2{font-family:'Cinzel',serif;font-size:16px;letter-spacing:3px;color:var(--accent);margin:48px 0 16px;font-weight:700;}
.post-body strong{color:var(--text);font-weight:600;}
.post-body em{color:var(--accent2);}
.post-body code{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--accent);background:var(--surface);padding:2px 8px;border:1px solid var(--border);}
.callout{background:var(--surface);border-left:3px solid var(--accent);padding:20px 24px;margin:32px 0;font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text);line-height:1.7;}
.post-body img{max-width:100%;height:auto;border:1px solid var(--border);margin:24px 0;display:block;}
.post-body .img-caption{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1px;margin:-16px 0 24px;}

.post-footer{border-top:1px solid var(--border);padding:40px 0;display:flex;justify-content:space-between;align-items:center;}
.post-footer a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:1px;}
.post-footer a:hover{color:var(--accent);}
footer{border-top:1px solid var(--border);padding:40px 0;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
footer a{color:var(--muted);text-decoration:none;}
footer a:hover{color:var(--accent);}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999;}

.loading{padding:80px 0;text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;}
.error-msg{padding:80px 0;text-align:center;color:var(--danger);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../index.html" class="logo">DRACEN<span>STEIN</span></a>
    <a href="index.html">&larr; BACK</a>
  </nav>

  <div id="post-loading" class="loading">LOADING POST...</div>
  <div id="post-error" class="error-msg" style="display:none;"></div>

  <div id="post-header" class="post-header" style="display:none;">
    <div class="post-meta" id="meta"></div>
    <h1 class="post-title" id="title"></h1>
    <div class="post-tags" id="tags"></div>
  </div>

  <div id="post-body" class="post-body" style="display:none;"></div>

  <div class="post-footer">
    <a href="../index.html">&larr; HOME</a>
    <a href="index.html">ALL POSTS &rarr;</a>
  </div>

  <footer>
    <div>DRACENSTEIN &middot; 2026</div>
    <a href="../index.html">dracenstein.com</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var sb = window.supabase.createClient('https://pmvgkmiihqyvgjcdcyjw.supabase.co', 'sb_publishable_DEcvBo1uq0dPziHCrUwfTQ_0sq6xkz5');

(function() {
  var params = new URLSearchParams(window.location.search);
  var postId = params.get('id');

  if (!postId) {
    showError('No post ID specified.');
    return;
  }

  sb.from('posts').select('title,content,week,tags,created_at').eq('id', postId).single()
  .then(function(res) {
    if (res.error) throw new Error(res.error.message);
    if (!res.data) { showError('Post not found.'); return; }
    renderPost(res.data);
  })
  .catch(function(err) {
    showError('Could not load post: ' + err.message);
  });

  function renderPost(post) {
    document.getElementById('post-loading').style.display = 'none';

    // Update page title
    document.title = post.title + ' | Dracenstein';

    // Meta
    var date = post.created_at ? new Date(post.created_at) : new Date();
    var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    var metaEl = document.getElementById('meta');
    metaEl.innerHTML = 'WEEK <span>' + String(post.week).padStart(3,'0') + '</span> &middot; ' + months[date.getMonth()] + ' ' + date.getFullYear();

    // Title
    document.getElementById('title').textContent = post.title;

    // Tags
    if (post.tags && post.tags.trim()) {
      var tagsEl = document.getElementById('tags');
      var tagArr = post.tags.split(',');
      tagsEl.innerHTML = tagArr.map(function(t) {
        return '<span class="post-tag">' + t.trim().toUpperCase() + '</span>';
      }).join('');
    }

    // Show header
    document.getElementById('post-header').style.display = 'block';

    // Content — convert line breaks to paragraphs, ![caption](url) to images
    var content = post.content || '';
    var paragraphs = content.split(/\n\s*\n/);
    var html = paragraphs.map(function(p) {
      p = p.trim();
      if (!p) return '';
      // Check if this paragraph is just an image
      var imgMatch = p.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
      if (imgMatch) {
        var cap = imgMatch[1], url = imgMatch[2];
        return '<img src="' + url + '" alt="' + cap + '">' + (cap ? '<div class="img-caption">' + cap + '</div>' : '');
      }
      // Inline images within text
      p = p.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m, cap, url) {
        return '</p><img src="' + url + '" alt="' + cap + '">' + (cap ? '<div class="img-caption">' + cap + '</div>' : '') + '<p>';
      });
      // Single line breaks become <br>
      p = p.replace(/\n/g, '<br>');
      return '<p>' + p + '</p>';
    }).join('');

    var bodyEl = document.getElementById('post-body');
    bodyEl.innerHTML = html;
    bodyEl.style.display = 'block';
  }

  function showError(msg) {
    document.getElementById('post-loading').style.display = 'none';
    var el = document.getElementById('post-error');
    el.textContent = msg;
    el.style.display = 'block';
  }
})();
</script>
</body>
</html>
